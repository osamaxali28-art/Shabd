name: Build Shabd

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Roman Urdu engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build + test core
        run: |
          cmake -B build -DSHABD_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  plugin:
    name: Plugin (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            targets: Shabd_VST3 Shabd_Standalone shabd-cli
          - name: macOS (Apple Silicon)
            os: macos-latest
            targets: Shabd_VST3 Shabd_AU Shabd_Standalone shabd-cli
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target ${{ matrix.targets }}

      - name: Detector smoke test (tiny model, sample clip)
        shell: bash
        run: |
          curl -sSL -o ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          CLI=$(find build -type f \( -name shabd-cli -o -name shabd-cli.exe \) | head -1)
          "$CLI" build/_deps/whisper-src/samples/jfk.wav --model ggml-tiny.bin --language en --cpu --out smoke
          test -s smoke.srt && test -s smoke.lrc && test -s smoke.ttml
          head -12 smoke.srt

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          ART=build/Shabd_artefacts/Release
          cp -R "$ART/VST3/Shabd.vst3" dist/
          if [ -d "$ART/AU/Shabd.component" ]; then cp -R "$ART/AU/Shabd.component" dist/; fi
          if [ -d "$ART/Standalone/Shabd.app" ]; then cp -R "$ART/Standalone/Shabd.app" dist/; fi
          if [ -f "$ART/Standalone/Shabd.exe" ]; then cp "$ART/Standalone/Shabd.exe" dist/; fi
          find build -type f \( -name shabd-cli -o -name shabd-cli.exe \) -exec cp {} dist/ \;
          cp lexicon/roman_urdu.tsv docs/ROMAN_URDU_STYLE.md dist/

      - uses: actions/upload-artifact@v5
        with:
          name: Shabd-${{ runner.os }}
          path: dist

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../Shabd-${{ runner.os }}.zip . > /dev/null
          else zip -ryq ../Shabd-${{ runner.os }}.zip .; fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Shabd-${{ runner.os }}.zip
